name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, and inspect package
    # Pin to 24.04: ubuntu-latest now resolves to 26.04, which the locked
    # Playwright 1.58.2 does not support (no chromium build/deps mapping).
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Unit tests
        run: bun run test:unit

      - name: Install Playwright browser
        run: bun x playwright install --with-deps chromium

      - name: End-to-end tests
        run: bun run test:e2e

      - name: Verify npm package contents
        run: npm pack --dry-run --ignore-scripts
